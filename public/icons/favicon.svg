<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Midnight Navy Core Gradient -->
    <linearGradient id="fav-core" x1="60" y1="6" x2="60" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1726" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#03060b" />
    </linearGradient>

    <!-- Metallic Platinum / Silver Bevel Rim -->
    <linearGradient id="fav-rim" x1="16" y1="10" x2="104" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="25%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Inner Rim Glow -->
    <linearGradient id="fav-inner-rim" x1="60" y1="20" x2="60" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Faceted Star Shading -->
    <linearGradient id="fav-star-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="fav-star-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="fav-glow" cx="60" cy="68" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="68" r="32" fill="url(#fav-glow)" />

  <!-- Shield Body -->
  <path
    d="M60 8
       C78 8 100 12 108 22
       C110 52 104 88 60 132
       C16 88 10 52 12 22
       C20 12 42 8 60 8Z"
    fill="url(#fav-core)"
    stroke="url(#fav-rim)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Trim -->
  <path
    d="M60 16
       C75 16 93 19 99 28
       C101 54 95 83 60 121
       C25 83 19 54 21 28
       C27 19 45 16 60 16Z"
    fill="none"
    stroke="url(#fav-inner-rim)"
    stroke-width="1.4"
  />

  <!-- Horizontal Axis Lines -->
  <line x1="28" y1="68" x2="44" y2="68" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  <line x1="76" y1="68" x2="92" y2="68" stroke="#38bdf8" stroke-width="1" opacity="0.5" />

  <!-- Faceted 8-Point Guardian Polaris Star -->
  <g>
    <!-- Vertical Top -->
    <polygon points="60,34 60,68 53,68" fill="url(#fav-star-dark)" />
    <polygon points="60,34 67,68 60,68" fill="url(#fav-star-light)" />

    <!-- Vertical Bottom -->
    <polygon points="60,102 60,68 67,68" fill="url(#fav-star-dark)" />
    <polygon points="60,102 53,68 60,68" fill="url(#fav-star-light)" />

    <!-- Horizontal Left -->
    <polygon points="26,68 60,61 60,68" fill="url(#fav-star-light)" />
    <polygon points="26,68 60,68 60,75" fill="url(#fav-star-dark)" />

    <!-- Horizontal Right -->
    <polygon points="94,68 60,68 60,61" fill="url(#fav-star-dark)" />
    <polygon points="94,68 60,75 60,68" fill="url(#fav-star-light)" />

    <!-- Diagonals -->
    <polygon points="38,46 60,64 56,60" fill="url(#fav-star-light)" />
    <polygon points="38,46 60,68 60,64" fill="url(#fav-star-dark)" />

    <polygon points="82,46 60,64 64,60" fill="url(#fav-star-dark)" />
    <polygon points="82,46 60,68 60,64" fill="url(#fav-star-light)" />

    <polygon points="38,90 60,68 56,76" fill="url(#fav-star-dark)" />
    <polygon points="38,90 60,72 60,68" fill="url(#fav-star-light)" />

    <polygon points="82,90 60,68 64,76" fill="url(#fav-star-light)" />
    <polygon points="82,90 60,72 60,68" fill="url(#fav-star-dark)" />

    <!-- Center Jewel -->
    <polygon points="60,62 66,68 60,74 54,68" fill="#f8fafc" />
    <polygon points="60,64 64,68 60,72 56,68" fill="#38bdf8" />
  </g>
</svg>
